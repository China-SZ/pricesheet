name: Build Linux x86_64 Release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build linux-x86_64 package
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Build release package
        env:
          # Runner is already Linux x86_64 — build on host (no container)
          BUILD_ON_HOST: "1"
        run: npm run build:linux-x64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pricesheet-linux-x86_64
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
